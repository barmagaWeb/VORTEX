<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='vg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%238B5CF6'/%3E%3Cstop offset='100%25' stop-color='%233B82F6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M20,15 L45,85 L55,85 L80,15 L62,15 L50,55 L38,15 Z' fill='url(%23vg)'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0A0D14" id="theme-color-meta" />
    <title>VORTEX — Connect. Share. Discover.</title>
    <meta name="description" content="VORTEX is a bilingual social networking platform. Connect with people, share moments, and discover communities." />
    <meta name="author" content="AUREX" />
    <meta property="og:site_name" content="VORTEX" />

    <!-- Inline script to set theme & direction before first paint (eliminates FOUC) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('vortex_theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = (saved === 'light' || saved === 'dark') ? saved : (systemDark ? 'dark' : 'light');
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
          var meta = document.getElementById('theme-color-meta') || document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0A0D14' : '#F8FAFC');

          var savedLang = localStorage.getItem('vortex_lang');
          if (savedLang === 'ar') {
            root.setAttribute('lang', 'ar');
            root.setAttribute('dir', 'rtl');
          } else {
            root.setAttribute('lang', 'en');
            root.setAttribute('dir', 'ltr');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts: Plus Jakarta Sans & IBM Plex Sans Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-bg text-fg antialiased min-h-[100dvh] overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
